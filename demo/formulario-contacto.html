<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Formulario de contacto · Demo n8n</title>
<style>
  :root { --bg:#f4f6fb; --card:#fff; --txt:#1d2433; --muted:#667085; --accent:#ea4b71; --ok:#12805c; --err:#c0362c; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--txt);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  .card { background:var(--card); width:100%; max-width:440px; padding:28px; border-radius:14px; box-shadow:0 8px 30px rgba(0,0,0,.08); }
  h1 { margin:0 0 4px; font-size:1.4rem; }
  p.sub { margin:0 0 20px; color:var(--muted); font-size:.92rem; }
  label { display:block; font-weight:600; font-size:.9rem; margin:14px 0 6px; }
  input, textarea { width:100%; padding:10px 12px; border:1px solid #d0d5dd; border-radius:8px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  button { margin-top:20px; width:100%; padding:12px; border:0; border-radius:8px; background:var(--accent); color:#fff; font-weight:700; font-size:1rem; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #estado { margin-top:14px; font-size:.92rem; min-height:1.2em; }
  .ok { color:var(--ok); } .err { color:var(--err); }
  footer { margin-top:18px; font-size:.78rem; color:var(--muted); text-align:center; }
</style>
</head>
<body>
<form class="card" id="form">
  <h1>Contáctanos</h1>
  <p class="sub">Demo: el formulario envía los datos a un webhook de n8n, que los guarda en PostgreSQL y envía un correo de aviso.</p>

  <label for="nombre">Nombre</label>
  <input id="nombre" name="nombre" required maxlength="120">

  <label for="email">Email</label>
  <input id="email" name="email" type="email" required maxlength="160">

  <label for="mensaje">Mensaje</label>
  <textarea id="mensaje" name="mensaje" required></textarea>

  <button type="submit" id="btn">Enviar</button>
  <div id="estado" role="status"></div>
  <footer>n8n · PostgreSQL · Gmail SMTP · Docker</footer>
</form>

<script>
  // Cambia a /webhook-test/contacto si quieres probar con "Execute workflow" sin activar el flujo
  const WEBHOOK_URL = "http://localhost:5678/webhook/contacto";

  const form = document.getElementById("form");
  const estado = document.getElementById("estado");
  const btn = document.getElementById("btn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    btn.disabled = true;
    estado.className = ""; estado.textContent = "Enviando...";
    try {
      // URLSearchParams = petición "simple": evita problemas de CORS al abrir el HTML desde tu compu
      const res = await fetch(WEBHOOK_URL, { method: "POST", body: new URLSearchParams(new FormData(form)) });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json().catch(() => ({}));
      estado.className = "ok";
      estado.textContent = "¡Gracias! Tu mensaje fue registrado" + (data.id ? " (#" + data.id + ")." : ".");
      form.reset();
    } catch (err) {
      estado.className = "err";
      estado.textContent = "No se pudo enviar (" + err.message + "). ¿Está n8n encendido y el flujo activo?";
    } finally {
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
